{% extends "base.html" %}{% block content %}
{% if result %}<pre class="result">{{ result }}</pre>{% endif %}
<section class="cards">
{% for target in ['auth','normal','playerbot'] %}
<div class="card"><strong>{{ target }}</strong><form method="post" action="/server/action"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="target" value="{{ target }}"><button name="action" value="status">Status</button><button name="action" value="restart">Restart</button><button name="action" value="stop">Stop</button><button name="action" value="start">Start</button></form></div>
{% endfor %}
</section>
{% endblock %}
