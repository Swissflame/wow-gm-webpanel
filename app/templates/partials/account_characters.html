{% if chars %}
<table class="inner-table">
  <tr><th>Name</th><th>Level</th><th>Online</th><th>Gold</th><th>Zone</th><th>Map</th><th>Position</th></tr>
  {% for c in chars %}
  <tr>
    <td>{{ c.name }}</td>
    <td>{{ c.level }}</td>
    <td>{{ "ja" if c.online else "nein" }}</td>
    <td>{{ (c.money or 0) // 10000 }}</td>
    <td>{{ c.zone }}</td>
    <td>{{ c.map }}</td>
    <td>{{ c.x }}, {{ c.y }}, {{ c.z }}</td>
  </tr>
  {% endfor %}
</table>
{% else %}
<p>Keine Charaktere gefunden.</p>
{% endif %}
